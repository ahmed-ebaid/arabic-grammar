name: arabic_grammar
description: A bilingual Arabic grammar learning app.
publish_to: none
version: 0.1.0+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate Android launcher layers with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon/app_icon_1024.png
  adaptive_icon_background: assets/app_icon/app_icon_background_1024.png
  adaptive_icon_foreground: assets/app_icon/app_icon_foreground_1024.png
  adaptive_icon_monochrome: assets/app_icon/app_icon_monochrome_1024.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/catalog.json
    - assets/content/glossary.json
    - assets/fonts/OFL-Amiri.txt
    - content/drafts/lesson_01.json
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
