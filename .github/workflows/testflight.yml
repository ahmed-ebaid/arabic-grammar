name: Upload iOS build to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 and verify iOS SDK
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "${sdk_version%%.*}" -lt 26 ]]; then
            echo "App Store Connect requires iOS SDK 26 or later; found $sdk_version." >&2
            exit 1
          fi
          echo "Building with iOS SDK $sdk_version"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate lesson drafts
        run: dart run tool/validate_content.dart

      - name: Verify RevenueCat App Store key
        env:
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
        shell: bash
        run: |
          if [[ "$REVENUECAT_IOS_API_KEY" != appl_* ]]; then
            echo "Set REVENUECAT_IOS_API_KEY to the public App Store SDK key." >&2
            exit 1
          fi

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        id: provisioning
        uses: apple-actions/download-provisioning-profiles@v6.1.0
        with:
          bundle-id: com.ebaidllc.arabicgrammar
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Configure distribution signing
        env:
          PROFILES: ${{ steps.provisioning.outputs.profiles }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import subprocess

          profiles = [
              profile for profile in json.loads(os.environ["PROFILES"])
              if profile["name"] == "Arabic Grammar App Store CI"
          ]
          if len(profiles) != 1:
              raise SystemExit("Expected exactly one profile named Arabic Grammar App Store CI.")
          profile = profiles[0]
          project_path = "ios/Runner.xcodeproj/project.pbxproj"
          project = plistlib.loads(subprocess.check_output([
              "plutil", "-convert", "xml1", "-o", "-", project_path,
          ]))
          objects = project["objects"]
          runner = next(obj for obj in objects.values()
                        if obj.get("isa") == "PBXNativeTarget" and obj.get("name") == "Runner")
          configurations = objects[runner["buildConfigurationList"]]["buildConfigurations"]
          for configuration_id in configurations:
              configuration = objects[configuration_id]
              if configuration["name"] not in ("Release", "Profile"):
                  continue
              settings = configuration["buildSettings"]
              settings["CODE_SIGN_STYLE"] = "Manual"
              settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              settings["PROVISIONING_PROFILE_SPECIFIER"] = profile["name"]
          with open(project_path, "wb") as output:
              plistlib.dump(project, output)
          with open("ios/ExportOptions.plist", "rb") as source:
              options = plistlib.load(source)
          options["signingStyle"] = "manual"
          options["signingCertificate"] = "Apple Distribution"
          options["provisioningProfiles"] = {
              "com.ebaidllc.arabicgrammar": profile["name"],
          }
          with open("ios/ExportOptions.plist", "wb") as output:
              plistlib.dump(options, output)
          PY

      - name: Calculate build number
        id: version
        shell: bash
        run: |
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          if [[ "$version" != *+* ]]; then
            echo "pubspec.yaml version must include a build number (for example, 0.1.0+17)." >&2
            exit 1
          fi

          build_name="${version%%+*}"
          base_build_number="${version##*+}"
          if [[ ! "$base_build_number" =~ ^[0-9]+$ ]]; then
            echo "The pubspec.yaml build number must be numeric." >&2
            exit 1
          fi

          build_number=$((base_build_number + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1))
          echo "name=$build_name" >> "$GITHUB_OUTPUT"
          echo "number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building version $build_name ($build_number)"

      - name: Build signed IPA
        env:
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
        run: >-
          flutter build ipa --release
          --dart-define=APP_ENV=production
          --dart-define="REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY"
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}
          --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        id: ipa
        shell: bash
        run: |
          ipa_path="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5.4.0
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'