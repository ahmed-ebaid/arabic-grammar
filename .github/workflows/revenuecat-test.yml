name: RevenueCat Test Store build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate lesson drafts
        run: dart run tool/validate_content.dart

      - name: Build Android Test Store APK
        env:
          REVENUECAT_TEST_API_KEY: ${{ secrets.REVENUECAT_TEST_API_KEY }}
        shell: bash
        run: |
          if [[ "$REVENUECAT_TEST_API_KEY" != test_* ]]; then
            echo "Set REVENUECAT_TEST_API_KEY to a public Test Store SDK key." >&2
            exit 1
          fi
          flutter build apk --debug \
            --dart-define=APP_ENV=development \
            --dart-define="REVENUECAT_TEST_API_KEY=$REVENUECAT_TEST_API_KEY"

      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-grammar-revenuecat-test-only
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
